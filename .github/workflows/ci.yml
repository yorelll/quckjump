name: QuickJump CI

on:
  push:
    branches:
      - main
      - feature/**
    paths:
      - "Flow.Launcher.Plugin.QuickJump/**"
      - "QuickJump.sln"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "Flow.Launcher.Plugin.QuickJump/**"
      - "QuickJump.sln"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test QuickJump
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 7
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "7.0.x"

      - name: Restore
        run: dotnet restore QuickJump.sln

      - name: Build
        run: dotnet build QuickJump.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test QuickJump.sln --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickjump-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: warn
