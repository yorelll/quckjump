name: Publish QuickJump Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish this QuickJump release (normally publish from a matching v* tag)"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Build, verify, package, and publish
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 7
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "7.0.x"

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $manifest = Get-Content "Flow.Launcher.Plugin.QuickJump/plugin.json" -Raw | ConvertFrom-Json
          if ($manifest.Language -ne "csharp") {
            Write-Error "Release manifest requires Language=csharp."
            exit 1
          }
          $version = $manifest.Version
          if ($version -notmatch '^\d+\.\d+\.\d+([-.+].+)?$') {
            Write-Error "Manifest version '$version' is not a supported semantic version."
            exit 1
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append

      - name: Verify pushed tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -ne "${{ steps.version.outputs.tag }}") {
            Write-Error "Tag '${{ github.ref_name }}' must equal '${{ steps.version.outputs.tag }}'."
            exit 1
          }

      - name: Restore
        run: dotnet restore QuickJump.sln

      - name: Build and test
        run: |
          dotnet build QuickJump.sln --configuration Release --no-restore
          dotnet test QuickJump.sln --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Stage QuickJump plugin
        id: stage
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "QuickJump.Release"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage | Out-Null
          $output = "Flow.Launcher.Plugin.QuickJump/bin/Release"
          if (-not (Test-Path $output)) {
            Write-Error "Expected build output directory '$output' was not found."
            exit 1
          }
          Copy-Item "$output/*" $stage -Recurse -Force
          "stage=$stage" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Verify release staging
        shell: pwsh
        run: |
          ./scripts/verify-release.ps1 `
            -StageDirectory "${{ steps.stage.outputs.stage }}" `
            -ExpectedVersion "${{ steps.version.outputs.version }}"

      - name: Package QuickJump plugin
        id: package
        shell: pwsh
        run: |
          $archive = "QuickJump-${{ steps.version.outputs.version }}.zip"
          Compress-Archive -Path "${{ steps.stage.outputs.stage }}\*" -DestinationPath $archive -Force
          "archive=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii
          Get-Item $archive | Select-Object Name,Length

      - name: Publish QuickJump release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: QuickJump v${{ steps.version.outputs.version }}
          files: ${{ steps.package.outputs.archive }}
          body: |
            QuickJump for Flow Launcher.

            Download the archive and extract its contents directly into a Flow Launcher
            plugin directory. The package includes the plugin and its required managed
            dependencies.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
